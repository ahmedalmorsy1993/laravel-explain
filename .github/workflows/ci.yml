name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly: catch docs links that Laravel renamed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-links
      - run: npx vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: laravel-explain-vsix
          path: '*.vsix'
